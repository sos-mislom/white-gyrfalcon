import groovy.json.JsonSlurper
import java.util.Properties
plugins { id 'com.android.application' }
def accessFile = rootProject.file('../../.private/ops/public-access.json')
def standUrl = project.findProperty("standUrl") ?: (accessFile.isFile() ? new JsonSlurper().parse(accessFile).baseUrl : 'https://vsm-194-87-250-20.sslip.io')
def signingFile = rootProject.file('../../.private/android/signing.properties')
def signing = new Properties()
if (signingFile.isFile()) signingFile.withInputStream { signing.load(it) }
def mobileTokenFile = rootProject.file('../../.private/android/mobile-token.txt')
def mobileToken = mobileTokenFile.isFile() ? mobileTokenFile.getText('UTF-8').trim() : ''
if (mobileToken && !(mobileToken ==~ /[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/)) throw new GradleException('Invalid mobile access pass')
if (standUrl != "http://127.0.0.1:18040" && !(standUrl ==~ /https:\/\/[a-zA-Z0-9.-]+/)) throw new GradleException('Expected an HTTPS origin without path')
android {
    namespace 'ru.vsm.trainer'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'ru.vsm.trainer'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.5.2'
        buildConfigField 'String', 'STAND_URL', '"' + standUrl + '"'
        buildConfigField 'String', 'MOBILE_ACCESS_TOKEN', '"' + mobileToken + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (signingFile.isFile()) {
            publicRelease {
                storeFile rootProject.file('../../.private/android/release.jks')
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.stand'; debuggable true }
        release {
            minifyEnabled false
            if (signingFile.isFile() && !mobileToken) throw new GradleException('Signed release requires a mobile access pass')
            if (signingFile.isFile()) signingConfig signingConfigs.publicRelease
        }
    }
}
