    example_phrases:
    - 'Сверю билет с паспортом: при одной такой ошибке правила допускают проезд.'
    sop_bonus: 5
    duration_minutes: 1
    requires: []
    outcomes:
      critical_success: &id001
        reaction_vector: Алексей принимает проверенный следующий шаг и благодарит за ясность.
        status: resolved
        procedure_delta: 15
        service_delta: 8
        nps_delta: 8
      success: *id001
      failure:
        reaction_vector: Пассажир показывает паспорт и просит проверить допустимую ошибку до завершения посадки.
        status: escalating
        procedure_delta: -4
        service_delta: -3
        nps_delta: -15
      critical_failure:
        reaction_vector: Пассажир показывает паспорт и просит проверить допустимую ошибку до завершения посадки.
        status: escalating
        procedure_delta: -10
        service_delta: -10
        nps_delta: -15
  - action_id: reject_single_typo
    intent_label: Из-за одной переставленной цифры я вас не пущу, покупать новый билет обязательно.
    example_phrases:
    - Из-за одной переставленной цифры я вас не пущу, покупать новый билет обязательно.
    is_violation: true
    sop_bonus: -10
    duration_minutes: 0.5
    requires: []
    outcomes:
      critical_success: &id002
        reaction_vector: Алексей указывает, что вопрос остался нерешённым, и просит старшего поезда.
        status: escalating
        procedure_delta: -15
        service_delta: -15
        nps_delta: -15
      success: *id002
      failure: *id002
      critical_failure: *id002
  escalation:
    warning_minutes: 5
    deadline_minutes: 12
    warning_vector: Пассажир показывает паспорт и просит проверить допустимую ошибку до завершения посадки.
    failure_vector: Алексей так и не получил(а) ответа; ситуация завершилась без решения.
    wrong_action_vector: Алексей возражает против предложенного шага и просит проверить правило.
    idle_vector: Пассажир показывает паспорт и просит проверить допустимую ошибку до завершения посадки.
