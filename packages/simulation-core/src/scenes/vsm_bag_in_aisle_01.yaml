    example_phrases:
    - Проход должен оставаться свободным. Давайте найдём подходящее место для чемодана.
    sop_bonus: 5
    duration_minutes: 1
    requires: []
    outcomes:
      critical_success: &id001
        reaction_vector: Виктор принимает проверенный следующий шаг и благодарит за ясность.
        status: resolved
        procedure_delta: 15
        service_delta: 8
        nps_delta: 8
      success: *id001
      failure:
        reaction_vector: Пассажиры обходят чемодан боком; проход нужно освободить до следующей остановки.
        status: escalating
        procedure_delta: -4
        service_delta: -3
        nps_delta: -15
      critical_failure:
        reaction_vector: Пассажиры обходят чемодан боком; проход нужно освободить до следующей остановки.
        status: escalating
        procedure_delta: -10
        service_delta: -10
        nps_delta: -15
