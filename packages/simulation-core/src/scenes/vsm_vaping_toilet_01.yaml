scenario_id: vsm_vaping_toilet_01
menu_label: Дым в санузле
type: character
title: Вейп в санузле — датчик сработал
visual:
  background: carriage
location:
  car_number: 2
  class_type: business
  zone: Туалетный модуль
character:
  portrait_key: artem
  id: char_artem_young
  name: Артём
  role: Студент магистратуры
  archetype: беспечный_молодой
  psychological_state:
    patience: 55
    aggression: 30
    stress: 20
    alcohol: 25
  hidden_biases:
  - 'Убеждён: электронные сигареты — это «просто пар», закон неприменим'
  - Немного выпил — снижена критичность
  mood_seed_variants:
  - tag: слегка_пьян
    patience_modifier: 0
    aggression_modifier: 15
  voice_profile:
    pitch: medium_high
    speed: 1.1
    tone: защищающийся, немного дерзкий
    tts_voice_hint: ru-RU-DmitryNeural
    gender: male
incident:
  category: rule_violation
  urgency: critical
  difficulty_dc: 14
  initial_speech: (Выходит из туалета.) А что? Это вейп — там вообще нет дыма, только пар. Датчик ваш барахлит.
    Это не курение по закону.
  context_description: Датчик сработал на аэрозоль в санузле. Проводник должен проверить причину сигнала и напомнить о запрете потребления никотинсодержащей продукции в вагоне.
  sop_reference: Приказ Минтранса № 352, п. 12; ФЗ № 15, ст. 12 ч. 1
  required_tools:
  - tablet_vsm
  - radio_bridge
  branches:
  - action_id: act_protocol_register_and_lnp
    intent_label: Объяснить запрет, проверить сигнал и сообщить старшему поезда при повторе
    example_phrases:
    - Датчик зафиксировал аэрозоль. В вагоне запрещено пользоваться вейпом. Пожалуйста, прекратите; если сигнал повторится, я сообщу старшему поезда для проверки.
    sop_bonus: 5
    outcomes:
      critical_success:
        nps_delta: -10
        safety_delta: 30
        procedure_delta: 25
        status: resolved
        reaction_vector: С облегчением принимает помощь; явно благодарит и переходит к следующему шагу.
      success:
        nps_delta: -25
        safety_delta: 25
        procedure_delta: 20
        status: resolved
        reaction_vector: Недоволен, но подчинился. ПРОФЕССИОНАЛЬНЫЙ УСПЕХ.
      failure:
        nps_delta: -40
        safety_delta: 10
        procedure_delta: 10
        status: escalating
        reaction_vector: Не удовлетворён решением; требует конкретного следующего шага, напряжение растёт.
      critical_failure:
        nps_delta: -50
        safety_delta: 5
        procedure_delta: 5
        status: escalating
        reaction_vector: Резко возмущается и требует вмешательства ответственного сотрудника.
    duration_minutes: 1
    requires: []
  - action_id: act_soft_ignore
    intent_label: Проигнорировать сигнал и разрешить вейп
    example_phrases:
    - Ну ладно, в следующий раз не надо. Идите на место.
    sop_bonus: -10
    outcomes:
      critical_success: null
      success: null
      failure:
        nps_delta: 30
        safety_delta: -50
        procedure_delta: -40
        status: failed
        reaction_vector: Пассажир продолжает пользоваться вейпом; сигнал требует повторной проверки и сообщения старшему поезда.
      critical_failure:
        nps_delta: 30
        safety_delta: -100
        procedure_delta: -100
        status: failed
        reaction_vector: Резко возмущается и требует вмешательства ответственного сотрудника.
    duration_minutes: 1
    requires: []
  - action_id: dismiss_passenger
    intent_label: Грубо отказать в помощи
    example_phrases:
    - Это не моя проблема, уходите
    sop_bonus: -10
    duration_minutes: 0.5
    requires: []
    outcomes:
      critical_success:
        reaction_vector: Возмущается грубым отказом; исходная проблема остаётся нерешённой.
        status: escalating
        service_delta: -40
        nps_delta: -30
      success:
        reaction_vector: Возмущается грубым отказом; исходная проблема остаётся нерешённой.
        status: escalating
        service_delta: -40
        nps_delta: -30
      failure:
        reaction_vector: Возмущается грубым отказом; исходная проблема остаётся нерешённой.
        status: escalating
        service_delta: -40
        nps_delta: -30
      critical_failure:
        reaction_vector: Возмущается грубым отказом; исходная проблема остаётся нерешённой.
        status: escalating
        service_delta: -40
        nps_delta: -30
  escalation:
    warning_minutes: 4
    deadline_minutes: 10
    warning_vector: Время идёт; ситуация требует решения прямо сейчас. Персонаж заметно теряет терпение.
    failure_vector: Время на решение вышло; ситуация ухудшилась, персонаж констатирует бездействие.
    wrong_action_vector: Проводник предлагает неподходящий шаг; персонаж указывает на нерешённую исходную проблему.
    idle_vector: Проводник молчит; персонаж сам напоминает о проблеме и просит конкретного действия.
    warning_time_penalty: 10
    failure_time_penalty: 30
    wrong_action_penalty: 10
    idle_time_penalty: 10
    conversation_vector: Персонаж отвечает на свободную реплику, удерживая исходную проблему и свой характер; решение
      ещё не достигнуто.
aliases: []
legal_basis:
- act: Приказ Минтранса № 352
  clause: п. 12
  url: https://publication.pravo.gov.ru/Document/View/0001202210270033
  application: В вагонах, включая тамбуры, запрещено потреблять никотинсодержащую продукцию.
- act: ФЗ № 15
  clause: ст. 12 ч. 1
  url: https://publication.pravo.gov.ru/Document/View/0001201302250007
  application: Федеральный запрет касается поездов дальнего следования; санкции применяют уполномоченные органы,
    а не проводник.
